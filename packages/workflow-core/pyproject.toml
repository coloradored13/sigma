[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sigma-public-core"
version = "0.1.0a1"
requires-python = ">=3.11"
description = "Resource-scoped transactional workflows for Sigma Public"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/sigma_public_core"]

[tool.hatch.build.targets.sdist]
include = ["/src/sigma_public_core/**/*.py", "/pyproject.toml", "/README.md", "/LICENSE", "/.gitignore"]
