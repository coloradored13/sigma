[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sigma-public-memory"
version = "0.1.0a1"
requires-python = ">=3.11"
description = "Explicitly scoped memory MCP for Sigma Public"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["sigma-public-core==0.1.0a1", "mcp==1.30.0"]

[project.scripts]
sigma-public-memory = "sigma_public_memory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma_public_memory"]

[tool.hatch.build.targets.sdist]
include = ["/src/sigma_public_memory/**/*.py", "/pyproject.toml", "/README.md", "/LICENSE", "/.gitignore"]
