name: Acceptance tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      - run: uv sync --frozen --all-packages
      - run: uv run --frozen --all-packages ruff check .
      - run: uv run --frozen --all-packages pytest -q
      - run: uv run --frozen --all-packages python examples/offline_demo.py
      - run: uv build --all-packages --out-dir dist
      - run: uv run --frozen --all-packages python tools/check_distributions.py dist
      - run: uv run --frozen --all-packages python tools/smoke_wheels.py dist
