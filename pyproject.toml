[project]
name = "sigma-public-workspace"
version = "0.1.0a1"
requires-python = ">=3.11"
description = "Development workspace for the independent Sigma Public successor"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1.2,<2"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sigma-public-core = { workspace = true }
sigma-public-memory = { workspace = true }
sigma-public-verify = { workspace = true }
sigma-public = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
